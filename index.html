    <!-- U4: hide the native cursor *before* paint on fine pointers so there is no
         flash of the native arrow before the custom ring takes over. The React
         effect in Cursor.jsx is responsible for removing this class if the
         pointer type changes after load. -->
    <script>
      (function () {
        try {
          if (window.matchMedia('(pointer: fine)').matches &&
              !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('has-cursor')
          }
        } catch (e) { /* no-op: legacy browser, native cursor stays */ }
      })()
    </script>
